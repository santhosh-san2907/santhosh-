{% extends "base.html" %}

{% block title %}
FitBuddy | Error
{% endblock %}


{% block content %}

<section class="card error-card">

    <p class="eyebrow">
        SOMETHING WENT WRONG
    </p>

    <h1>
        We couldn't complete that request.
    </h1>

    <p>
        {{ message }}
    </p>

    <a
        class="primary inline"
        href="/"
    >
        Back to FitBuddy
    </a>

</section>

{% endblock %}
